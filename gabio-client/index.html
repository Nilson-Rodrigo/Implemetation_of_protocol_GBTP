<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gábio Bank - Cliente GBTP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrap">

        <!-- Barra lateral -->
        <aside class="sidebar">
            <div class="sidebar-title">Gábio Bank</div>
            <div class="sidebar-sub">Gabio Bank Transaction Protocol</div>
        </aside>

        <!-- Conteúdo principal -->
        <main class="main">
            <div class="page-title">Nova transação</div>
            <div class="page-sub">Preencha os dados e envie via protocolo GBTP</div>

            <!-- Formulário -->
            <div class="form-card">

                <div class="field">
                    <label for="operation">Operação</label>
                    <select id="operation">
                        <option value="BALANCE">Consultar Saldo</option>
                        <option value="DEPOSIT">Depósito</option>
                        <option value="WITHDRAW">Saque</option>
                        <option value="TRANSFER">Transferência</option>
                    </select>
                </div>

                <div class="field">
                    <label for="accountId">ID da Conta</label>
                    <input type="text" id="accountId" placeholder="Ex: 1001">
                </div>

                <!-- Campo valor: escondido em BALANCE -->
                <div class="field" id="valueGroup">
                    <label for="value">Valor (R$)</label>
                    <input type="number" id="value" placeholder="0.00" value="0" min="0" step="0.01">
                </div>

                <!-- Campo destino: só aparece em Transferência -->
                <div class="field" id="toAccountGroup">
                    <label for="toAccountId">ID da Conta Destino</label>
                    <input type="text" id="toAccountId" placeholder="Ex: 1002">
                </div>

                <button id="sendBtn">Enviar operação</button>

            </div>

            <!-- Área de resultado -->
            <div class="result-card">
                <div id="resultDefault" class="result-text">O resultado da operação aparecerá aqui</div>
                <div id="resultContent" class="result-content">
                    <div class="result-row">
                        <span class="result-label">Status</span>
                        <span id="resStatus" class="result-value">—</span>
                    </div>
                    <div class="result-row">
                        <span class="result-label">Saldo</span>
                        <span class="result-value">R$ <span id="resBalance">—</span></span>
                    </div>
                    <div class="result-row">
                        <span class="result-label">Detalhe</span>
                        <span id="resMessage" class="result-value">—</span>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="dist/main.js" type="module"></script>

    <script>
        const operationSelect = document.getElementById('operation');
        const toAccountGroup = document.getElementById('toAccountGroup');
        const valueGroup = document.getElementById('valueGroup');

        function atualizarCampos() {
            const op = operationSelect.value;
            valueGroup.style.display = op === 'BALANCE' ? 'none' : 'block';
            toAccountGroup.style.display = op === 'TRANSFER' ? 'block' : 'none';
        }

        atualizarCampos();

        operationSelect.addEventListener('change', atualizarCampos);

        const observer = new MutationObserver(function () {
            const status = document.getElementById('resStatus').textContent;
            if (status && status !== '—') {
                document.getElementById('resultDefault').style.display = 'none';
                document.getElementById('resultContent').style.display = 'flex';
            }
        });
        observer.observe(document.getElementById('resStatus'), { childList: true, subtree: true, characterData: true });
    </script>
</body>
</html>
